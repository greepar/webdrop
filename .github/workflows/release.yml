name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Import Swift signing keys
        if: runner.os == 'Linux'
        run: curl --fail --location https://www.swift.org/keys/all-keys.asc | gpg --import
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3 (Swiftly)
        with:
          swift-version: '6.4.2'
      - name: Install Linux ICU subset tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm icu-devtools
      - name: Verify PowerShell
        run: pwsh --version
      - name: Install Static Linux SDK
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          swift sdk install 'https://download.swift.org/swift-6.4.2-release/static-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz' --checksum '3786b179936d9cc9e266dd506bd1654176358d7b25288e243359f4d17cc4dc5a'
          if ($LASTEXITCODE -ne 0) { throw 'Static SDK installation failed.' }
      - run: npm ci
      - name: Check frontend
        run: npm run check && npm run lint
      - name: Test backend
        run: swift test --package-path apps/api -j 3
      - name: Build embedded release
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: ./scripts/build-api.ps1 -Target $env:RELEASE_TARGET -Jobs 3
      - name: Install HTTP contract checks
        run: python3 -m venv .contract-env && .contract-env/bin/pip install -r scripts/requirements-contract.txt
      - name: Verify contracts
        run: .contract-env/bin/python scripts/test-contract.py
      - name: Smoke native release and shutdown
        if: matrix.target != 'linux-arm64'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: .contract-env/bin/python scripts/api-shutdown-smoke.py --binary "dist/api/webdrop-$RELEASE_TARGET" --validate-contract
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webdrop-${{ matrix.target }}
          path: |
            dist/api/webdrop-${{ matrix.target }}
            dist/api/webdrop-${{ matrix.target }}.json
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows PowerShell and frontend
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Type check failed' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Lint failed' }
          ./scripts/embed-web.ps1
          $errorsFound = @()
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            $errorsFound += $errors
          }
          if ($errorsFound.Count) { throw ($errorsFound | Out-String) }
          if (-not (Test-Path apps/api/Sources/WebdropAPI/Generated/EmbeddedWebAssets.generated.swift)) { throw 'Embedding failed' }
          try {
            ./scripts/build-api.ps1
            throw 'Expected unsupported native Windows target to be rejected'
          } catch {
            if ($_.Exception.Message -notmatch 'Native Windows releases are not supported') { throw }
          }
          Write-Host 'Windows frontend, PowerShell parsing/embedding, and unsupported-target diagnostic passed.'

  publish:
    name: Publish release assets
    needs: [build, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: webdrop-*
          merge-multiple: true
          path: release-assets
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "WebDrop $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
