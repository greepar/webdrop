name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Swift with official Swiftly
        shell: bash
        run: |
          set -euo pipefail
          export SWIFTLY_HOME_DIR="$RUNNER_TEMP/swiftly-home"
          export SWIFTLY_BIN_DIR="$RUNNER_TEMP/swiftly-bin"
          mkdir -p "$SWIFTLY_HOME_DIR" "$SWIFTLY_BIN_DIR"
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y libcurl4-openssl-dev
            curl -fLsS https://www.swift.org/keys/all-keys.asc | gpg --import
            url="https://download.swift.org/swiftly/linux/swiftly-1.1.2-$(uname -m).tar.gz"
            curl -fLsS "$url" -o "$RUNNER_TEMP/swiftly.tar.gz"
            curl -fLsS "$url.sig" -o "$RUNNER_TEMP/swiftly.tar.gz.sig"
            gpg --verify "$RUNNER_TEMP/swiftly.tar.gz.sig" "$RUNNER_TEMP/swiftly.tar.gz"
            tar xzf "$RUNNER_TEMP/swiftly.tar.gz" -C "$SWIFTLY_BIN_DIR"
          else
            curl -fLsS https://download.swift.org/swiftly/darwin/swiftly.pkg -o "$RUNNER_TEMP/swiftly.pkg"
            installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
            cp "$HOME/.swiftly/bin/swiftly" "$SWIFTLY_BIN_DIR/swiftly"
          fi
          export PATH="$SWIFTLY_BIN_DIR:$PATH"
          swiftly init --skip-install --quiet-shell-followup --assume-yes --no-modify-profile
          swiftly install --use 6.4.2 --assume-yes --post-install-file "$RUNNER_TEMP/swift-post-install.sh"
          if [[ -f "$RUNNER_TEMP/swift-post-install.sh" ]]; then bash "$RUNNER_TEMP/swift-post-install.sh"; fi
          echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          swiftly use --print-location >> "$GITHUB_PATH"
          swift --version
      - name: Install Linux ICU subset tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm icu-devtools
      - name: Verify PowerShell
        run: pwsh --version
      - name: Install Static Linux SDK
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          swift sdk install 'https://download.swift.org/swift-6.4.2-release/static-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz' --checksum '3786b179936d9cc9e266dd506bd1654176358d7b25288e243359f4d17cc4dc5a'
          if ($LASTEXITCODE -ne 0) { throw 'Static SDK installation failed.' }
      - run: npm ci
      - name: Check frontend
        run: npm run check && npm run lint
      - name: Test backend
        run: swift test --package-path apps/api -j 3
      - name: Build embedded release
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: ./scripts/build-api.ps1 -Target $env:RELEASE_TARGET -Jobs 3
      - name: Install HTTP contract checks
        run: python3 -m venv .contract-env && .contract-env/bin/pip install -r scripts/requirements-contract.txt
      - name: Verify contracts
        run: .contract-env/bin/python scripts/test-contract.py
      - name: Smoke native release and shutdown
        if: matrix.target != 'linux-arm64'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: .contract-env/bin/python scripts/api-shutdown-smoke.py --binary "dist/api/webdrop-$RELEASE_TARGET" --validate-contract
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: webdrop-${{ matrix.target }}
          path: |
            dist/api/webdrop-${{ matrix.target }}
            dist/api/webdrop-${{ matrix.target }}.json
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Build windows-x86_64
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Swift for Windows
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'swift-installer.exe'
          Invoke-WebRequest 'https://download.swift.org/swift-6.4.2-release/windows10/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE-windows10.exe' -OutFile $installer
          $result = Start-Process $installer -ArgumentList '/quiet', '/norestart', '/log', "$env:RUNNER_TEMP/swift-install.log" -Wait -PassThru
          if ($result.ExitCode -notin @(0, 3010)) { throw "Swift installation failed: $($result.ExitCode)" }
          foreach ($scope in @('Machine', 'User')) {
            foreach ($entry in [Environment]::GetEnvironmentVariables($scope).GetEnumerator()) {
              if ($entry.Key -eq 'Path') { $env:Path += ";$($entry.Value)" }
              else { [Environment]::SetEnvironmentVariable($entry.Key, $entry.Value, 'Process') }
            }
          }
          $env:Path.Split(';') | Select-Object -Unique | Add-Content $env:GITHUB_PATH
          foreach ($entry in Get-ChildItem Env:) {
            if ($entry.Name -ne 'Path' -and $entry.Name -match '^(SDKROOT|SWIFT.*|DEVELOPER_DIR|INCLUDE|LIB)$') { "$($entry.Name)=$($entry.Value)" | Add-Content $env:GITHUB_ENV }
          }
          swift --version
          if ($LASTEXITCODE -ne 0) { throw 'Swift is unavailable after installation' }
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Windows release
        run: ./scripts/build-api.ps1 -Target windows-x86_64 -Jobs 3
      - name: Smoke Windows release
        run: python scripts/api-windows-smoke.py --binary dist/api/windows-x86_64/webdrop.exe
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: webdrop-windows-x86_64
          path: |
            dist/api/webdrop-windows-x86_64.zip
            dist/api/webdrop-windows-x86_64.zip.json
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish release assets
    needs: [build, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: webdrop-*
          merge-multiple: true
          path: release-assets
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "WebDrop $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
