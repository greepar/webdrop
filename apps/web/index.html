<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f2ee" />
    <meta name="description" content="WebDrop：在同一房间里跨设备传递文字、文件、图片和视频。" />
    <script>
      (function () {
        try {
          var stored = null;
          try { stored = localStorage.getItem('webdrop-theme'); } catch (storageError) {}
          var dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1c1d1f');
        } catch (e) {}
      })();
    </script>
    <title>WebDrop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
